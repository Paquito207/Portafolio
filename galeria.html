    <style>
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {

      .serif-italic {
        font-family: "Playfair Display", serif;
        font-style: italic;
      }

      /* Animaciones */
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }

      .animate-in {
        animation: slideInUp 0.6s ease-out forwards;
      }

      .modal-overlay {
        animation: fadeIn 0.3s ease-out;
      }

      /* Card Stagger */
      .project-card:nth-child(1) { animation-delay: 0.05s; }
      .project-card:nth-child(2) { animation-delay: 0.1s; }
      .project-card:nth-child(3) { animation-delay: 0.15s; }
      .project-card:nth-child(4) { animation-delay: 0.2s; }
      .project-card:nth-child(5) { animation-delay: 0.25s; }
      .project-card:nth-child(6) { animation-delay: 0.3s; }
      .project-card:nth-child(7) { animation-delay: 0.35s; }
      .project-card:nth-child(8) { animation-delay: 0.4s; }
      .project-card:nth-child(9) { animation-delay: 0.45s; }

      /* Featured Project */
      .featured-card {
        grid-column: span 1;
      }

      @media (min-width: 768px) {
        .featured-card {
          grid-column: span 2;
          grid-row: span 2;
        }
      }

      /* Focus visible */
      .project-card:focus-visible,
      .filter-btn:focus-visible {
        outline: 2px solid #1A1A1A;
        outline-offset: 2px;
      }

      .dark .project-card:focus-visible,
      .dark .filter-btn:focus-visible {
        outline: 2px solid #E8E8E3;
      }

      /* Badge animations */
      .badge {
        transition: all 0.3s ease;
      }

      .badge:hover {
        transform: scale(1.05);
      }

      /* Tech stack animation */
      .tech-item {
        display: inline-block;
        animation: slideInUp 0.5s ease-out backwards;
      }

      /* Image aspect ratio */
      .aspect-video {
        aspect-ratio: 16 / 9;
      }

      .aspect-square {
        aspect-ratio: 1 / 1;
      }

      /* Overlay improvements */
      .project-overlay {
        backdrop-filter: blur(4px);
      }

      /* Loading skeleton */
      @keyframes skeleton-loading {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }

      .skeleton {
        background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
        background-size: 1000px 100%;
        animation: skeleton-loading 2s infinite;
      }

      /* Slider de imágenes */
      .image-slider {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 1rem;
      }

      .slider-container {
        display: flex;
        transition: transform 0.5s ease;
        width: 100%;
      }

      .slider-slide {
        min-width: 100%;
        width: 100%;
      }

      .slider-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        background: rgba(255, 255, 255, 0.9);
        color: #1A1A1A;
        border: none;
        padding: 12px 16px;
        cursor: pointer;
        font-size: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        width: 48px;
        height: 48px;
      }

      .slider-nav:hover {
        background: rgba(255, 255, 255, 1);
        transform: translateY(-50%) scale(1.1);
      }

      .slider-nav.prev {
        left: 12px;
      }

      .slider-nav.next {
        right: 12px;
      }

      .slider-indicators {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .slider-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }

      .slider-indicator.active {
        background: white;
        width: 24px;
        border-radius: 4px;
      }

      /* Details section */
      #detailsContainer {
        margin: 0;
        transition: all 0.5s ease;
      }

      .project-details {
        animation: slideInUp 0.6s ease-out;
        border-top: 3px solid #1A1A1A;
        margin-top: 3rem;
        padding-top: 3rem;
      }

      .dark .project-details {
        border-top-color: #E8E8E3;
      }

      .details-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }

      .details-close-btn {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease;
      }

      .details-close-btn:hover {
        transform: rotate(90deg);
      }

      let currentLang = localStorage.getItem("site_language_v1") || "es";

      function updateLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("site_language_v1", lang);
        
        const t = translations[lang];
        document.documentElement.lang = lang;
        document.getElementById("page-title").textContent = t.title;
        document.getElementById("langDisplay").textContent = lang.toUpperCase();
        
        document.querySelectorAll("[data-i18n]").forEach(el => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) {
            el.textContent = t[key];
          }
        });
      }

      function initLanguageSelector() {
        const LANG_BTN = document.getElementById("langBtn");
        const LANG_MENU = document.getElementById("langMenu");
        const LANG_OPTIONS = document.querySelectorAll(".lang-option");

        if (!LANG_BTN) return;

        function showLangMenu() {
          LANG_MENU.classList.remove("hidden");
          LANG_MENU.classList.add("block");
          LANG_BTN.setAttribute("aria-expanded", "true");
          document.addEventListener("click", onDocClickLang);
        }

        function hideLangMenu() {
          LANG_MENU.classList.add("hidden");
          LANG_MENU.classList.remove("block");
          LANG_BTN.setAttribute("aria-expanded", "false");
          LANG_BTN.focus();
          document.removeEventListener("click", onDocClickLang);
        }

        function onDocClickLang(e) {
          if (!LANG_MENU.contains(e.target) && !LANG_BTN.contains(e.target))
            hideLangMenu();
        }

        LANG_BTN.addEventListener("click", function (e) {
          e.stopPropagation();
          if (LANG_MENU.classList.contains("hidden")) showLangMenu();
          else hideLangMenu();
        });

        LANG_OPTIONS.forEach(option => {
          option.addEventListener("click", function () {
            const lang = this.getAttribute("data-lang");
            updateLanguage(lang);
            hideLangMenu();
          });
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !LANG_MENU.classList.contains("hidden")) {
            hideLangMenu();
          }
        });
      }
    </script>

      document.addEventListener("DOMContentLoaded", function () {
        const MENU_BTN = document.getElementById("menuBtn");
        const MAIN_MENU = document.getElementById("mainMenu");
        const THEME_BTN = document.getElementById("themeToggleBtn");
        const THEME_ICON = document.getElementById("themeIcon");
        const THEME_KEY = "site_theme_v1";
        const docEl = document.documentElement;

        function showMenu() {
          MAIN_MENU.classList.remove("hidden");
          MAIN_MENU.classList.add("block");
          MENU_BTN.setAttribute("aria-expanded", "true");
          document.addEventListener("click", onDocClick);
        }

        function hideMenu() {
          MAIN_MENU.classList.add("hidden");
          MAIN_MENU.classList.remove("block");
          MENU_BTN.setAttribute("aria-expanded", "false");
          MENU_BTN.focus();
          document.removeEventListener("click", onDocClick);
        }

        function toggleMenu() {
          if (MAIN_MENU.classList.contains("hidden")) showMenu();
          else hideMenu();
        }

        function onDocClick(e) {
          if (!MAIN_MENU.contains(e.target) && !MENU_BTN.contains(e.target))
            hideMenu();
        }

        MENU_BTN.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleMenu();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !MAIN_MENU.classList.contains("hidden")) {
            hideMenu();
          }
        });

        window.addEventListener("resize", function () {
          if (
            window.innerWidth >= 1024 &&
            !MAIN_MENU.classList.contains("hidden")
          ) {
            hideMenu();
          }
        });

        function applyTheme(theme) {
          if (theme === "dark") {
            docEl.classList.add("dark");
            THEME_BTN.setAttribute("aria-pressed", "true");
            THEME_ICON.innerHTML =
              '<span class="material-icons text-base">light_mode</span>';
          } else {
            docEl.classList.remove("dark");
            THEME_BTN.setAttribute("aria-pressed", "false");
            THEME_ICON.innerHTML =
              '<span class="material-icons text-base">dark_mode</span>';
          }
          localStorage.setItem(THEME_KEY, theme);
        }

        (function initTheme() {
          const saved = localStorage.getItem(THEME_KEY);
          if (saved === "dark" || saved === "light") applyTheme(saved);
          else {
            const prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            applyTheme(prefersDark ? "dark" : "light");
          }
        })();

        THEME_BTN.addEventListener("click", function () {
          const isDark = docEl.classList.contains("dark");
          applyTheme(isDark ? "light" : "dark");
        });

        updateLanguage(currentLang);
        initLanguageSelector();
      });
    </script>

        15: {

          description: "Plantilla de e-commerce para floristeria premium. Catálogo de arreglos especiales, bouquets personalizados y servicios de entrega. Sistema de compra integrado con galería de imágenes, reseñas y recomendaciones. Diseño elegante responsivo con enfoque en experiencia visual.",
          role: "Frontend Developer",
          status: "Concepto",
          year: "2026",
          client: "Proyecto Personal",
          clientType: "Empresa",
          impact: "Plataforma de florería profesional",
          tech: ["HTML5", "CSS3", "JavaScript", "Tailwind CSS"],
          category: "frontend",
          gradient: "from-rose-600 to-pink-600",
          images: ["files/kl22.png", "files/kl22-1.png", "files/kl22-2.png"],
          liveUrl: "#",
          repoUrl: "https://github.com/Paquito207/projects-portafolio/blob/main/Peony%20-%20Special%20Flower%20Bouquet/27.html"
        }
      };

      let currentSlide = 0;
      let selectedProjectId = null;

      // Filtrado de proyectos
      const filterBtns = document.querySelectorAll(".filter-btn");
      
      function renderProjectGrid(startFromId = null) {
        const container = document.getElementById("projectGrid");
        container.innerHTML = "";
        
        let startId = startFromId ? parseInt(startFromId) + 1 : 1;
        
        for (let i = startId; i <= Object.keys(projectsData).length; i++) {
          const project = projectsData[i];
          if (!project) continue;
          
          const card = document.createElement("div");
          card.className = "project-card rounded-2xl overflow-hidden relative group cursor-pointer animate-in";
          card.setAttribute("data-category", project.category);
          card.setAttribute("data-project-id", i);
          card.setAttribute("tabindex", "0");
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `${project.name} - Proyecto ${i}`);
          
          const imgUrl = project.images[0] || "https://via.placeholder.com/400x300?text=" + project.name;
          
          card.innerHTML = `
            <div class="relative">
              <img src="${imgUrl}" alt="${project.name}" class="w-full aspect-video object-cover" loading="lazy" />
              <div class="absolute inset-0 bg-black/20 group-hover:bg-black/5 transition-colors z-10"></div>
              <div class="absolute top-4 left-4 z-20 bg-primary text-white px-3 py-1 rounded-full text-xs font-bold">#${String(i).padStart(2, '0')}</div>
              <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-6 z-20">
                <button class="text-white hover:text-yellow-400 transition-colors text-sm font-bold uppercase flex items-center gap-2 view-project-btn">
                  <span data-i18n="viewProject">Ver Proyecto</span>
                  <span class="material-icons text-base">arrow_forward</span>
                </button>
              </div>
            </div>
            <div class="p-6 bg-card-light dark:bg-card-dark h-full">
  <h3 class="text-xl font-bold dark:text-white">
    #${String(i).padStart(2, '0')}. ${project.name}
  </h3>
</div>
          `;
          
          card.addEventListener("click", () => showProjectDetails(i));
          card.addEventListener("keypress", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              showProjectDetails(i);
            }
          });
          
          container.appendChild(card);
        }
      }

      filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const filter = btn.getAttribute("data-filter");
          closeProjectDetails();

          // Actualizar botones activos
          filterBtns.forEach(b => {
            b.classList.remove("bg-primary", "text-white", "dark:bg-white", "dark:text-primary");
            b.classList.add("bg-transparent", "border-2", "border-primary", "dark:border-white", "text-primary", "dark:text-white");
          });
          btn.classList.remove("bg-transparent", "border-2", "border-primary", "dark:border-white", "text-primary", "dark:text-white");
          btn.classList.add("bg-primary", "text-white", "dark:bg-white", "dark:text-primary");

          // Filtrar proyectos
          const cards = document.querySelectorAll(".project-card");
          cards.forEach(card => {
            if (filter === "all" || card.getAttribute("data-category") === filter) {
              card.style.display = "block";
              setTimeout(() => card.style.opacity = "1", 10);
            } else {
              card.style.opacity = "0";
              setTimeout(() => card.style.display = "none", 300);
            }
          });
        });
      });

      // Mostrar detalles del proyecto
      function showProjectDetails(projectId) {
        selectedProjectId = projectId;
        const project = projectsData[projectId];
        if (!project) return;

        const t = translations[currentLang] || translations.es;
        const statusText = project.status === "En producción" ? t.production : 
                          project.status === "MVP" ? t.mvp :
                          project.status === "Concepto" ? t.concept : t.inProgress;

        const detailsHTML = `
          <div class="project-details w-full">
            <div class="details-header">
              <div>
                <span class="text-primary dark:text-white text-sm font-bold">#${String(projectId).padStart(2, '0')}</span>
                <h2 class="text-3xl md:text-4xl font-serif font-bold">${project.name}</h2>
              </div>
              <button class="details-close-btn text-primary dark:text-white" onclick="closeProjectDetails()">
                <span class="material-icons">close</span>
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
              <!-- Izquierda: Descripción y detalles -->
              <div class="space-y-8">
                <div>
                  <p class="text-gray-700 dark:text-gray-300 leading-relaxed text-lg mb-6">${project.description}</p>
                </div>

                <!-- Metadata Grid -->
                <div class="grid grid-cols-2 gap-6 py-6 border-y border-gray-300 dark:border-gray-700">
                  <div>
                    <p class="text-xs font-bold uppercase text-gray-600 dark:text-gray-400 mb-2"><span data-i18n="role">${t.role}</span></p>
                    <p class="font-semibold text-primary dark:text-white">${project.role}</p>
                  </div>
                  <div>
                    <p class="text-xs font-bold uppercase text-gray-600 dark:text-gray-400 mb-2"><span data-i18n="status">${t.status}</span></p>
                    <p class="font-semibold text-primary dark:text-white">${statusText}</p>
                  </div>
                  <div>
                    <p class="text-xs font-bold uppercase text-gray-600 dark:text-gray-400 mb-2"><span data-i18n="year">${t.year}</span></p>
                    <p class="font-semibold text-primary dark:text-white">${project.year}</p>
                  </div>
                  <div>
                    <p class="text-xs font-bold uppercase text-gray-600 dark:text-gray-400 mb-2"><span data-i18n="client">${t.client}</span></p>
                    <p class="font-semibold text-primary dark:text-white">${project.client}</p>
                  </div>
                  <div class="col-span-2">
                    <p class="text-xs font-bold uppercase text-gray-600 dark:text-gray-400 mb-2"><span data-i18n="impact">${t.impact}</span></p>
                    <p class="font-semibold text-primary dark:text-white">${project.impact}</p>
                  </div>
                </div>

                <!-- Tecnologías -->
                <div>
                  <p class="text-xs font-bold uppercase text-gray-600 dark:text-gray-400 mb-3"><span data-i18n="tech">${t.tech}</span></p>
                  <div class="flex flex-wrap gap-2">
                    ${project.tech.map(tech => `<span class="text-xs bg-primary/10 dark:bg-white/10 text-primary dark:text-white px-3 py-1 rounded-full">${tech}</span>`).join("")}
                  </div>
                </div>

                <!-- CTA Buttons -->
                <div class="flex flex-wrap gap-4 pt-4">
                  <a href="${project.repoUrl}" target="_blank" rel="noopener noreferrer" class="px-6 py-3 border-2 border-primary dark:border-white text-primary dark:text-white rounded-full font-bold uppercase text-sm hover:bg-primary hover:text-white dark:hover:bg-white dark:hover:text-primary transition-colors flex items-center gap-2">
                    <span class="material-icons text-base">code</span>
                    <span data-i18n="repository">${t.repository}</span>
                  </a>
                </div>
              </div>

              <!-- Derecha: Slider de imágenes/Video -->
              <div class="image-slider w-full h-[400px] lg:h-[400px]">
                <div class="slider-container" style="transform: translateX(0%);">
                  ${project.video ? 
                    `<video src="${project.video}" class="slider-slide w-full h-full object-cover" controls controlsList="nodownload" preload="metadata"></video>` 
                    : ''
                  }
                  ${project.images.filter(img => img).map(img => 
                    `<img src="${img}" alt="${project.name}" class="slider-slide w-full h-full object-cover" loading="lazy" />`
                  ).join("")}
                </div>

                <!-- Botones de navegación -->
                ${((project.video ? 1 : 0) + project.images.filter(img => img).length) > 1 ? `
                <button class="slider-nav prev" onclick="prevSlide()">❮</button>
                <button class="slider-nav next" onclick="nextSlide()">❯</button>
                ` : ''}

                <!-- Indicadores -->
                <div class="slider-indicators">
                  ${(project.video ? ['video'] : []).concat(project.images.filter(img => img)).map((_, idx) => 
                    `<button class="slider-indicator ${idx === currentSlide ? 'active' : ''}" onclick="goToSlide(${idx})"></button>`
                  ).join("")}
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById("detailsContainer").innerHTML = detailsHTML;
        currentSlide = 0;
        
        // Renderizar proyectos siguientes (grid lineal)
        renderProjectGrid(projectId);
        
        // Scroll a los detalles
        setTimeout(() => {
          document.getElementById("detailsContainer").scrollIntoView({ behavior: "smooth" });
        }, 100);
      }

      function closeProjectDetails() {
        document.getElementById("detailsContainer").innerHTML = "";
        selectedProjectId = null;
        currentSlide = 0;
        renderProjectGrid();
      }

      function prevSlide() {
        const project = projectsData[selectedProjectId];
        if (project) {
          const totalSlides = (project.video ? 1 : 0) + project.images.filter(img => img).length;
          currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
          updateSlider();
        }
      }

      function nextSlide() {
        const project = projectsData[selectedProjectId];
        if (project) {
          const totalSlides = (project.video ? 1 : 0) + project.images.filter(img => img).length;
          currentSlide = (currentSlide + 1) % totalSlides;
          updateSlider();
        }
      }

      function goToSlide(idx) {
        currentSlide = idx;
        updateSlider();
      }

      function updateSlider() {
        const slider = document.querySelector(".slider-container");
        if (slider) {
          slider.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        
        const indicators = document.querySelectorAll(".slider-indicator");
        indicators.forEach((ind, idx) => {
          if (idx === currentSlide) {
            ind.classList.add("active");
          } else {
            ind.classList.remove("active");
          }
        });
      }

      // Inicialización
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('proyecto');
        
        if (projectId && projectsData[projectId]) {
          showProjectDetails(parseInt(projectId));
        } else {
          renderProjectGrid();
        }
      });

      // Event listeners para botones "Ver Caso"
      document.addEventListener("click", (e) => {
        if (e.target.closest(".view-project-btn")) {
          const card = e.target.closest(".project-card");
          if (card) {
            const projectId = card.getAttribute("data-project-id");
            showProjectDetails(projectId);
          }
        }
      });
    </script>
  </body>
